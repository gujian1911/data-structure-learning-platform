<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自测答题 - 数据结构课程学习平台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .app-figures { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 16px; }
    .app-figure { margin: 0; padding: 8px; border: 1px solid var(--border, #e5e7eb); border-radius: 8px; background: #fff; }
    .app-figure img { display: block; max-width: 100%; max-height: 320px; cursor: zoom-in; }
    .app-figure figcaption { font-size: .85rem; color: #6b7280; text-align: center; margin-top: 6px; }
    .app-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
    .app-toolbar .hint { font-size: .85rem; color: #9ca3af; }
    .app-upload-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px dashed #9ca3af; border-radius: 8px; background: #f9fafb; color: #374151; font-size: .9rem; cursor: pointer; }
    .app-upload-btn:hover { background: #eef2ff; border-color: var(--primary, #6366f1); }
    .app-attachments { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .attach-item { position: relative; border: 1px solid var(--border, #e5e7eb); border-radius: 8px; background: #fff; padding: 6px; max-width: 180px; }
    .attach-item img { display: block; max-width: 166px; max-height: 120px; border-radius: 6px; cursor: zoom-in; }
    .attach-item .attach-name { display: block; margin-top: 4px; font-size: .78rem; color: #6b7280; word-break: break-all; max-height: 2.4em; overflow: hidden; }
    .attach-doc { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: #374151; padding: 8px 10px; }
    .attach-remove { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border: none; border-radius: 50%; background: #ef4444; color: #fff; font-size: 12px; line-height: 20px; text-align: center; cursor: pointer; padding: 0; }
    .help-row { margin-top: 8px; }
    .help-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border: 1px solid #93c5fd; border-radius: 999px; background: #eff6ff; color: #2563eb; font-size: .85rem; cursor: pointer; }
    .help-btn:hover { background: #dbeafe; }
    .help-btn-qwen { border-color: #c4b5fd; background: #f5f3ff; color: #7c3aed; }
    .help-btn-qwen:hover { background: #ede9fe; }
  </style>
</head>
<body>
  <!-- 导航栏（与平台保持一致） -->
    <nav class="navbar">
    <a href="index.html" class="nav-brand">📚 数据结构课程</a>
    <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="ch1.html">课程学习</a></li>
      <li><a href="quiz-ch1.html">随堂练习</a></li>
      <li><a href="selftest.html" class="active">题库自测</a></li>
      <li><a href="mock-exam.html">模拟试题</a></li>
      <li><a href="experiment.html">实验中心</a></li>
      <li><a href="knowledge.html">知识库</a></li>
      <li><a href="discuss.html">交流讨论</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="container" style="padding-top: 32px;">
      <!-- 顶部信息栏 -->
      <div class="quiz-progress" id="progress-bar">
        <span class="progress-text" id="progress-text">0 / 0</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <span class="progress-text" id="timer-text" style="min-width:60px;">00:00</span>
      </div>

      <!-- 答题区 -->
      <div id="quiz-area">
        <!-- 由JS动态生成 -->
      </div>

      <!-- 提交按钮区 -->
      <div id="submit-area" style="display: flex; gap: 12px; margin-top: 24px;">
        <button class="btn btn-primary" onclick="submitQuiz()">📝 提交答案</button>
        <button class="btn btn-secondary" onclick="resetQuiz()">🔄 重新答题</button>
        <a href="selftest.html" class="btn btn-secondary">↩ 返回选题</a>
      </div>

      <!-- 结果区 -->
      <div id="result-area" style="display: none; margin-top: 24px;">
        <div class="card result-card">
          <h2>📊 测试结果</h2>
          <div class="result-score" id="result-score">0/0</div>
          <div class="result-detail">
            <div class="result-item">
              <div class="num num-correct" id="result-correct">0</div>
              <div class="label">正确</div>
            </div>
            <div class="result-item">
              <div class="num num-wrong" id="result-wrong">0</div>
              <div class="label">错误</div>
            </div>
            <div class="result-item">
              <div class="num num-empty" id="result-empty">0</div>
              <div class="label">未答</div>
            </div>
            <div class="result-item">
              <div class="num" style="color: var(--primary);" id="result-rate">0%</div>
              <div class="label">正确率</div>
            </div>
            <div class="result-item" id="result-app-item" style="display:none;">
              <div class="num" style="color: #8b5cf6;" id="result-app">0</div>
              <div class="label">应用题自评</div>
            </div>
          </div>
          <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="toggleExplanations()">📖 查看解析</button>
            <button class="btn btn-secondary" onclick="resetQuiz()">🔄 重新答题</button>
            <a href="selftest.html" class="btn btn-secondary">↩ 重新选题</a>
            <a href="index.html" class="btn btn-secondary">🏠 返回首页</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>数据结构课程学习网站</p>
  </footer>

  <script src="js/selftest-data.js?v=4"></script>
  <script>
    const chapters = {
      1: '绪论', 2: '线性表', 3: '栈和队列', 4: '串、数组和广义表',
      5: '树', 6: '图', 7: '查找', 8: '排序'
    };

    let quizQuestions = [];
    let timerInterval = null;
    let startTime = null;
    let submitted = false;

    // 解析URL参数
    function getParams() {
      const params = new URLSearchParams(location.search);
      return {
        chapters: params.get('ch') ? params.get('ch').split(',').map(Number) : [],
        types: params.get('type') ? params.get('type').split(',') : [],
        count: parseInt(params.get('count')) || 10,
        mode: params.get('mode') || 'random'
      };
    }

    // 转义题干中的尖括号，避免被当作 HTML 标签解析（如 0<i<=n+1、<a,b>）
    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeQuestion(q) {
      const o = { ...q };
      ['question', 'analysis', 'explanation'].forEach(k => {
        if (typeof o[k] === 'string') o[k] = escHtml(o[k]);
      });
      if (typeof o.answer === 'string') o.answer = escHtml(o.answer);
      if (Array.isArray(o.answer)) o.answer = o.answer.map(escHtml);
      if (Array.isArray(o.options)) o.options = o.options.map(escHtml);
      return o;
    }

    // 收集题目
    function collectQuestions(params) {
      let all = [];
      params.chapters.forEach(chId => {
        const chKey = 'ch' + chId;
        const data = selftestData[chKey];
        if (!data) return;

        params.types.forEach(type => {
          const questions = data[type] || [];
          questions.forEach(q => {
            all.push(escapeQuestion({ ...q, chapter: chId, chapterName: chapters[chId], type: type }));
          });
        });
      });

      if (params.mode === 'random') {
        all = shuffleArray(all);
      }

      if (params.count > 0 && all.length > params.count) {
        all = all.slice(0, params.count);
      }

      return all;
    }

    // 洗牌
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 渲染题目
    function renderQuiz() {
      const area = document.getElementById('quiz-area');
      let html = '';
      let qIdx = 0;

      const judges = quizQuestions.filter(q => q.type === 'judge');
      const choices = quizQuestions.filter(q => q.type === 'choice');
      const fills = quizQuestions.filter(q => q.type === 'fill');
      const applications = quizQuestions.filter(q => q.type === 'application');

      // 按「判断 → 选择 → 填空 → 应用」的渲染顺序重排题目，
      // 保证页面题号与 submitQuiz 中的批改索引一一对应
      quizQuestions = [...judges, ...choices, ...fills, ...applications];

      if (judges.length > 0) {
        html += `<div class="card" style="margin-bottom:20px;"><div class="card-title">✅ 判断题（共${judges.length}题）</div></div>`;
        judges.forEach(q => {
          html += renderJudgeQuestion(q, qIdx);
          qIdx++;
        });
      }

      if (choices.length > 0) {
        html += `<div class="card" style="margin:24px 0 20px;"><div class="card-title">🔘 选择题（共${choices.length}题）</div></div>`;
        choices.forEach(q => {
          html += renderChoiceQuestion(q, qIdx);
          qIdx++;
        });
      }

      if (fills.length > 0) {
        html += `<div class="card" style="margin:24px 0 20px;"><div class="card-title">✏️ 填空题（共${fills.length}题）</div></div>`;
        fills.forEach(q => {
          html += renderFillQuestion(q, qIdx);
          qIdx++;
        });
      }

      if (applications.length > 0) {
        html += `<div class="card" style="margin:24px 0 20px;"><div class="card-title">📝 应用题（共${applications.length}题，提交后查看参考答案自评）</div></div>`;
        applications.forEach(q => {
          html += renderApplicationQuestion(q, qIdx);
          qIdx++;
        });
      }

      if (html === '') {
        html = `<div class="card" style="text-align:center; padding:48px;">
          <p style="font-size:1.2rem; margin-bottom:16px;">所选章节和题型没有匹配的题目</p>
          <a href="selftest.html" class="btn btn-primary">返回重新选择</a>
        </div>`;
      }

      area.innerHTML = html;
      updateProgress();
    }

    // 渲染判断题
    function renderJudgeQuestion(q, idx) {
      const chTag = `<span class="tag tag-blue" style="margin-right:6px;">第${q.chapter}章</span>`;
      return `
        <div class="quiz-question" id="q-${idx}">
          <p><strong>${idx + 1}、${chTag}${q.question}</strong></p>
          <div class="quiz-options">
            <label><input type="radio" name="q${idx}" value="true" onchange="updateProgress()"> ✓ 正确</label>
            <label><input type="radio" name="q${idx}" value="false" onchange="updateProgress()"> ✗ 错误</label>
          </div>
          <div class="help-row">${helpButtons(idx)}</div>
          <div class="explanation" id="exp-${idx}">正确答案：${q.answer ? '✓ 正确' : '✗ 错误'}。${q.explanation || ''}</div>
        </div>`;
    }

    // 渲染选择题
    function renderChoiceQuestion(q, idx) {
      const chTag = `<span class="tag tag-blue" style="margin-right:6px;">第${q.chapter}章</span>`;
      const optionsHtml = (q.options || []).map((opt, i) => {
        const letter = String.fromCharCode(65 + i);
        return `<label><input type="radio" name="q${idx}" value="${letter}" onchange="updateProgress()"> ${letter}. ${opt}</label>`;
      }).join('');

      return `
        <div class="quiz-question" id="q-${idx}">
          <p><strong>${idx + 1}、${chTag}${q.question}</strong></p>
          <div class="quiz-options">
            ${optionsHtml}
          </div>
          <div class="help-row">${helpButtons(idx)}</div>
          <div class="explanation" id="exp-${idx}">正确答案：${q.answer}。${q.explanation || ''}</div>
        </div>`;
    }

    // 渲染填空题
    function renderFillQuestion(q, idx) {
      const chTag = `<span class="tag tag-blue" style="margin-right:6px;">第${q.chapter}章</span>`;
      let questionText = q.question;
      const blankCount = (questionText.match(/_{3,}/g) || []).length;

      if (blankCount > 0) {
        let blankIdx = 0;
        questionText = questionText.replace(/_{3,}/g, () => {
          const input = `<input type="text" class="fill-input" id="fill-${idx}-${blankIdx}" data-idx="${blankIdx}" oninput="updateProgress()" placeholder="填写答案">`;
          blankIdx++;
          return input;
        });
      }

      const answerText = Array.isArray(q.answer) ? q.answer.join('；') : q.answer;
      return `
        <div class="quiz-question" id="q-${idx}">
          <p><strong>${idx + 1}、${chTag}${questionText}</strong></p>
          <div class="help-row">${helpButtons(idx)}</div>
          <div class="explanation" id="exp-${idx}">正确答案：${answerText}。${q.explanation || ''}</div>
        </div>`;
    }

    // 渲染应用题配图（题目图 / 参考答案图）
    function renderFigures(list) {
      if (!list || !list.length) return '';
      return `<div class="app-figures">` + list.map(item => {
        const src = typeof item === 'string' ? item : item.src;
        const cap = typeof item === 'string' ? '' : (item.caption || '');
        return `<figure class="app-figure">
          <img src="${src}" alt="题目插图" loading="lazy" onclick="window.open(this.src)" title="点击查看大图">
          ${cap ? `<figcaption>${cap}</figcaption>` : ''}
        </figure>`;
      }).join('') + `</div>`;
    }

    // 渲染应用题
    function renderApplicationQuestion(q, idx) {
      const chTag = `<span class="tag tag-blue" style="margin-right:6px;">第${q.chapter}章</span>`;
      // 将换行和代码块渲染为HTML
      let questionHtml = q.question
        .replace(/```([\s\S]*?)```/g, '<pre class="code-block">$1</pre>')
        .replace(/\n/g, '<br>');
      const qFigures = renderFigures(q.images || (q.image ? [q.image] : []));
      const aFigures = renderFigures(q.answerImages || (q.answerImage ? [q.answerImage] : []));
      return `
        <div class="quiz-question application-question" id="q-${idx}">
          <p><strong>${idx + 1}、${chTag}${questionHtml}</strong></p>
          ${qFigures}
          <textarea class="app-textarea" id="app-${idx}" rows="8" placeholder="请在此输入你的答案（支持直接 Ctrl+V 粘贴图片或文字）..." oninput="updateProgress()" onpaste="handleAppPaste(event, ${idx})"></textarea>
          <div class="app-toolbar">
            <button type="button" class="app-upload-btn" onclick="triggerUpload(${idx}, 'image')">📷 上传图片</button>
            <button type="button" class="app-upload-btn" onclick="triggerUpload(${idx}, 'doc')">📎 上传文档</button>
            ${helpButtons(idx)}
            <span class="hint">也可直接在答题框中粘贴截图 / 文字 / 代码</span>
          </div>
          <div class="app-attachments" id="attach-${idx}"></div>
          <div class="app-answer" id="app-answer-${idx}" style="display:none;">
            <div class="app-ref-title">📋 参考答案：</div>
            <div class="app-ref-body">${(q.answer || '').replace(/```([\s\S]*?)```/g, '<pre class="code-block">$1</pre>').replace(/\n/g, '<br>')}</div>
            ${aFigures}
            ${q.analysis ? `<div class="app-analysis"><strong>解析：</strong>${q.analysis}</div>` : ''}
            <div class="app-selfeval">
              <span>自评打分：</span>
              <button class="btn btn-secondary app-eval-btn" onclick="selfEval(${idx}, 'correct')" style="padding:4px 16px;">✓ 掌握</button>
              <button class="btn btn-secondary app-eval-btn" onclick="selfEval(${idx}, 'partial')" style="padding:4px 16px;">△ 部分掌握</button>
              <button class="btn btn-secondary app-eval-btn" onclick="selfEval(${idx}, 'wrong')" style="padding:4px 16px;">✗ 未掌握</button>
            </div>
          </div>
        </div>`;
    }

    // ====== 求助：百度AI（带题干搜索）/ 千问（复制题干打开页面） ======
    function askHelp(idx, engine) {
      const q = quizQuestions[idx];
      if (!q) return;
      // 去掉 HTML 标签（题干可能含转义后的实体、选项标签等）
      const tmp = document.createElement('div');
      tmp.innerHTML = q.question.split('```').join('');
      let text = (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
      if (engine === 'qwen') {
        // 千问不支持 URL 带题，复制题干到剪贴板，打开后 Ctrl+V 即可
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText('请解答这道数据结构题：' + text).catch(() => {});
        }
        window.open('https://www.tongyi.com/qianwen/', '_blank');
      } else {
        // 百度搜索结果页顶部会直接显示百度AI生成的解答
        if (text.length > 180) text = text.slice(0, 180);
        window.open('https://www.baidu.com/s?wd=' + encodeURIComponent(text), '_blank');
      }
    }

    // 所有题型共用的求助按钮组
    function helpButtons(idx) {
      return `<button type="button" class="help-btn" onclick="askHelp(${idx}, 'baidu')">🤖 不会？求助百度AI</button>
              <button type="button" class="help-btn help-btn-qwen" onclick="askHelp(${idx}, 'qwen')">🤖 不会？求助千问</button>`;
    }

    // ====== 应用题/编程题附件：粘贴与上传 ======
    // 每题附件仅保存在本页内存中（纯静态站，无后端），刷新后清空
    const appAttachments = {};

    function addAttachment(idx, att) {
      (appAttachments[idx] = appAttachments[idx] || []).push(att);
      renderAttachments(idx);
      updateProgress();
    }

    function removeAttachment(idx, i) {
      if (!appAttachments[idx]) return;
      appAttachments[idx].splice(i, 1);
      renderAttachments(idx);
      updateProgress();
    }

    function renderAttachments(idx) {
      const box = document.getElementById('attach-' + idx);
      if (!box) return;
      const list = appAttachments[idx] || [];
      box.innerHTML = list.map((a, i) => {
        const removeBtn = `<button type="button" class="attach-remove" onclick="removeAttachment(${idx}, ${i})" title="删除">×</button>`;
        if (a.kind === 'image') {
          return `<div class="attach-item">${removeBtn}
            <img src="${a.dataUrl}" alt="${a.name}" onclick="window.open(this.src)" title="点击查看大图">
            <span class="attach-name">${a.name}</span>
          </div>`;
        }
        return `<div class="attach-item attach-doc">${removeBtn}📄 <span class="attach-name">${a.name}（${a.sizeText}）</span></div>`;
      }).join('');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + 'B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
      return (bytes / 1024 / 1024).toFixed(2) + 'MB';
    }

    // 处理粘贴：图片读成 dataURL 插入附件；文字/代码走默认粘贴行为
    function handleAppPaste(event, idx) {
      const items = (event.clipboardData || event.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          event.preventDefault();
          const file = item.getAsFile();
          if (!file) continue;
          const reader = new FileReader();
          reader.onload = e => addAttachment(idx, { kind: 'image', name: '粘贴图片 ' + new Date().toLocaleTimeString(), dataUrl: e.target.result });
          reader.readAsDataURL(file);
        }
        // 文本（含代码）不拦截，由浏览器正常粘贴到 textarea
      }
    }

    // 触发文件选择
    function triggerUpload(idx, kind) {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.accept = kind === 'image'
        ? 'image/*'
        : '.doc,.docx,.pdf,.txt,.md,.c,.cpp,.java,.py,.js,.html,.css,.zip,.rar';
      input.onchange = () => {
        Array.from(input.files || []).forEach(file => {
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = e => addAttachment(idx, { kind: 'image', name: file.name, dataUrl: e.target.result });
            reader.readAsDataURL(file);
          } else {
            addAttachment(idx, { kind: 'doc', name: file.name, sizeText: formatSize(file.size) });
          }
        });
      };
      input.click();
    }

    // 更新进度
    function updateProgress() {
      const total = quizQuestions.length;
      let answered = 0;

      quizQuestions.forEach((q, idx) => {
        if (q.type === 'fill') {
          const blankCount = (q.question.match(/_{3,}/g) || []).length;
          let hasAnswer = false;
          for (let i = 0; i < blankCount; i++) {
            const input = document.getElementById(`fill-${idx}-${i}`);
            if (input && input.value.trim()) hasAnswer = true;
          }
          if (hasAnswer) answered++;
        } else if (q.type === 'application') {
          const textarea = document.getElementById(`app-${idx}`);
          const hasAttach = (appAttachments[idx] || []).length > 0;
          if ((textarea && textarea.value.trim()) || hasAttach) answered++;
        } else {
          const selected = document.querySelector(`input[name="q${idx}"]:checked`);
          if (selected) answered++;
        }
      });

      document.getElementById('progress-text').textContent = `${answered} / ${total}`;
      const pct = total > 0 ? Math.round(answered / total * 100) : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    // 应用题自评记录
    let appSelfEval = {};

    // 提交答案
    function submitQuiz() {
      if (submitted) return;
      submitted = true;
      stopTimer();

      let correct = 0, wrong = 0, empty = 0, appTotal = 0;
      appSelfEval = {};

      quizQuestions.forEach((q, idx) => {
        const expEl = document.getElementById(`exp-${idx}`);

        if (q.type === 'judge') {
          const selected = document.querySelector(`input[name="q${idx}"]:checked`);
          const labels = document.querySelectorAll(`input[name="q${idx}"]`);
          labels.forEach(inp => {
            const label = inp.closest('label');
            inp.disabled = true;
            if (inp.value === String(q.answer)) {
              label.style.background = '#d1fae5';
              label.style.borderColor = '#059669';
            }
            if (inp === selected && inp.value !== String(q.answer)) {
              label.style.background = '#fee2e2';
              label.style.borderColor = '#dc2626';
            }
          });
          if (!selected) { empty++; }
          else if (selected.value === String(q.answer)) { correct++; }
          else { wrong++; }
          expEl.classList.add('show');
        }
        else if (q.type === 'choice') {
          const selected = document.querySelector(`input[name="q${idx}"]:checked`);
          const labels = document.querySelectorAll(`input[name="q${idx}"]`);
          labels.forEach(inp => {
            const label = inp.closest('label');
            inp.disabled = true;
            if (inp.value === q.answer) {
              label.style.background = '#d1fae5';
              label.style.borderColor = '#059669';
            }
            if (inp === selected && inp.value !== q.answer) {
              label.style.background = '#fee2e2';
              label.style.borderColor = '#dc2626';
            }
          });
          if (!selected) { empty++; }
          else if (selected.value === q.answer) { correct++; }
          else { wrong++; }
          expEl.classList.add('show');
        }
        else if (q.type === 'fill') {
          const blankCount = (q.question.match(/_{3,}/g) || []).length;
          const answers = Array.isArray(q.answer) ? q.answer : [q.answer];
          let allCorrect = true;
          let hasEmpty = false;

          for (let i = 0; i < blankCount; i++) {
            const input = document.getElementById(`fill-${idx}-${i}`);
            if (!input) continue;
            input.disabled = true;
            const userVal = input.value.trim();
            if (!userVal) {
              hasEmpty = true;
              allCorrect = false;
              input.style.background = '#fee2e2';
              input.style.borderColor = '#dc2626';
            } else if (isFillMatch(userVal, answers, i, blankCount)) {
              input.style.background = '#d1fae5';
              input.style.borderColor = '#059669';
            } else {
              allCorrect = false;
              input.style.background = '#fee2e2';
              input.style.borderColor = '#dc2626';
            }
          }

          if (hasEmpty) { empty++; }
          else if (allCorrect) { correct++; }
          else { wrong++; }
          expEl.classList.add('show');
        }
        else if (q.type === 'application') {
          const textarea = document.getElementById(`app-${idx}`);
          if (textarea) textarea.disabled = true;
          const answerDiv = document.getElementById(`app-answer-${idx}`);
          if (answerDiv) answerDiv.style.display = 'block';
          appTotal++;
        }
      });

      const total = quizQuestions.length;
      const objectiveTotal = total - appTotal;
      document.getElementById('result-score').textContent = appTotal > 0 ? `${correct}/${objectiveTotal}（客观题）+ ${appTotal}应用题` : `${correct}/${total}`;
      document.getElementById('result-correct').textContent = correct;
      document.getElementById('result-wrong').textContent = wrong;
      document.getElementById('result-empty').textContent = empty;
      document.getElementById('result-rate').textContent = objectiveTotal > 0 ? Math.round(correct / objectiveTotal * 100) + '%' : '0%';
      if (appTotal > 0) {
        document.getElementById('result-app-item').style.display = 'flex';
        document.getElementById('result-app').textContent = `0/${appTotal}`;
      }
      document.getElementById('result-area').style.display = 'block';
      document.getElementById('submit-area').style.display = 'none';
      document.getElementById('progress-fill').style.width = '100%';
    }

    // 应用题自评
    function selfEval(idx, result) {
      appSelfEval[idx] = result;
      // 更新按钮样式
      const buttons = document.querySelectorAll(`#app-answer-${idx} .app-eval-btn`);
      buttons.forEach(btn => { btn.style.background = ''; btn.style.color = ''; });
      const colors = { correct: '#d1fae5', partial: '#fef3c7', wrong: '#fee2e2' };
      const label = event.target;
      label.style.background = colors[result];

      // 更新结果统计
      let appCount = Object.keys(appSelfEval).length;
      let appCorrect = Object.values(appSelfEval).filter(v => v === 'correct').length;
      let appTotal = quizQuestions.filter(q => q.type === 'application').length;
      document.getElementById('result-app').textContent = `${appCorrect}/${appTotal}`;
    }

    // 答案标准化（忽略空格和大小写差异）
    function normalizeAnswer(s) {
      return String(s).trim()
        .replace(/\s+/g, '')
        .replace(/[，、；;]/g, ',')
        .replace(/[（）()]/g, '')
        .replace(/。$/, '')
        .toLowerCase();
    }

    // 判断某个空是否答对
    // 多个空：答案数组按顺序与空一一对应
    // 单个空但答案数组含多个要素（如“0”“n-1”）：需全部答出才算对
    function isFillMatch(userVal, answers, i, blankCount) {
      const user = normalizeAnswer(userVal);
      if (blankCount === 1 && answers.length > 1) {
        return answers.every(a => user.includes(normalizeAnswer(a)));
      }
      return i < answers.length && user === normalizeAnswer(answers[i]);
    }

    // 重新答题
    function resetQuiz() {
      submitted = false;
      document.getElementById('result-area').style.display = 'none';
      document.getElementById('submit-area').style.display = 'flex';
      const params = getParams();
      quizQuestions = collectQuestions(params);
      renderQuiz();
      startTimer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 显示/隐藏解析
    function toggleExplanations() {
      const exps = document.querySelectorAll('.explanation');
      const anyHidden = [...exps].some(e => !e.classList.contains('show'));
      exps.forEach(e => e.classList.toggle('show', anyHidden));
      // 同时切换应用题参考答案
      const appAnswers = document.querySelectorAll('.app-answer');
      appAnswers.forEach(e => e.style.display = anyHidden ? 'block' : 'none');
    }

    // 计时器
    function startTimer() {
      startTime = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timer-text').textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    // 初始化
    const params = getParams();
    if (params.chapters.length === 0 || params.types.length === 0) {
      document.getElementById('quiz-area').innerHTML = `
        <div class="card" style="text-align:center; padding:48px;">
          <p style="font-size:1.2rem; margin-bottom:16px;">未选择章节或题型</p>
          <a href="selftest.html" class="btn btn-primary">返回选择</a>
        </div>`;
    } else {
      quizQuestions = collectQuestions(params);
      renderQuiz();
      if (quizQuestions.length > 0) startTimer();
    }

    // 键盘快捷键：Ctrl+Enter 提交
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.ctrlKey && !submitted) {
        submitQuiz();
      }
    });
  </script>
</body>
</html>
