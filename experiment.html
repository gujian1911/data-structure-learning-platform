<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验中心 - 数据结构课程</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lab-layout {
      display: flex;
      gap: 0;
      align-items: stretch;
      margin-top: 24px;
      width: 100%;
      height: calc(100vh - 200px);
      min-height: 560px;
    }
    .lab-sidebar {
      width: 230px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
      padding: 12px 10px;
    }
    .lab-sidebar-title {
      font-size: 0.9rem;
      color: var(--text-light, #6b7280);
      padding: 6px 12px 10px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 8px;
    }
    .lab-menu-item {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      color: var(--dark, #1f2937);
      cursor: pointer;
      line-height: 1.4;
      margin-bottom: 2px;
      transition: background .15s, color .15s;
    }
    .lab-menu-item:hover { background: #f1f5f9; }
    .lab-menu-item.active {
      background: var(--primary, #6366f1);
      color: #fff;
      font-weight: 600;
    }
    .lab-frame-wrap {
      flex: 1;
      min-width: 0;
      background: #fff;
      overflow: hidden;
      display: flex;
    }
    #lab-frame {
      flex: 1;
      width: 100%;
      border: none;
    }
    @media (max-width: 768px) {
      .lab-layout { flex-direction: column; height: auto; }
      .lab-sidebar {
        width: 100%;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px;
      }
      .lab-sidebar-title { display: none; }
      .lab-menu-item { white-space: nowrap; margin-bottom: 0; }
      .lab-frame-wrap { min-height: 70vh; }
    }
  </style>
</head>
<body>
    <nav class="navbar">
    <a href="index.html" class="nav-brand">📚 数据结构课程</a>
    <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="ch1.html">课程学习</a></li>
      <li><a href="quiz-ch1.html">随堂练习</a></li>
      <li><a href="selftest.html">题库自测</a></li>
      <li><a href="mock-exam.html">模拟试题</a></li>
      <li><a href="experiment.html" class="active">实验中心</a></li>
      <li><a href="knowledge.html">知识库</a></li>
      <li><a href="discuss.html">交流讨论</a></li>
    </ul>
  </nav>

  <main class="main">
    <div style="padding: 32px 24px 0;">
      <div class="page-header" style="margin-bottom: 0;">
        <h1>🧪 实验中心</h1>
        <p>左侧选择实验，右侧直接操作，无需跳转</p>
      </div>
    </div>

    <div class="lab-layout">
        <!-- 左侧：实验目录 -->
        <aside class="lab-sidebar" id="lab-sidebar">
          <div class="lab-sidebar-title">📋 实验目录（15 个）</div>
          <!-- 菜单由 JS 生成 -->
        </aside>

        <!-- 右侧：实验内容（iframe 子框架，原实验页面不改） -->
        <div class="lab-frame-wrap">
          <iframe id="lab-frame" title="实验内容"></iframe>
        </div>
    </div>
  </main>

  <footer class="footer">
    <p>数据结构课程学习网站</p>
  </footer>

  <script>
    // 15 个实验：文件名 + 目录显示名（与 shiyan*.html 一一对应）
    const labs = [
      { file: 'shiyan1-shunxubiao.html',  name: '实验一 顺序表的基本运算' },
      { file: 'shiyan2-danlianbiao.html', name: '实验二 单链表的建立' },
      { file: 'shiyan3-shunxuzhan.html',  name: '实验三 顺序栈与链栈' },
      { file: 'shiyan4-duilie.html',      name: '实验四 循环队列与链队列' },
      { file: 'shiyan5-zhuanzhi.html',    name: '实验五 三元组稀疏矩阵转置' },
      { file: 'shiyan6-erchashu.html',    name: '实验六 二叉树' },
      { file: 'shiyan7-erfenfind.html',   name: '实验七 二分法查找' },
      { file: 'shiyan8-maopao.html',      name: '实验八 冒泡排序' },
      { file: 'shiyan9-xuanze.html',      name: '实验九 选择排序' },
      { file: 'shiyan10-charu.html',      name: '实验十 插入排序' },
      { file: 'shiyan11-xier.html',       name: '实验十一 希尔排序' },
      { file: 'shiyan12-kuaisu.html',     name: '实验十二 快速排序' },
      { file: 'shiyan13-dui.html',        name: '实验十三 堆排序' },
      { file: 'shiyan14-haxi.html',       name: '实验十四 哈希表模拟数据存储' },
      { file: 'shiyan15-erfen.html',      name: '实验十五 二分法排序' }
    ];

    const frame = document.getElementById('lab-frame');
    const sidebar = document.getElementById('lab-sidebar');
    let current = 0;

    // 生成左侧目录
    labs.forEach((lab, i) => {
      const btn = document.createElement('button');
      btn.className = 'lab-menu-item';
      btn.textContent = lab.name;
      btn.onclick = () => selectLab(i);
      sidebar.appendChild(btn);
    });

    function selectLab(i, pushHistory) {
      current = i;
      // 加版本号防 iframe 缓存旧实验页（改完实验页后递增即可）
      frame.src = labs[i].file + '?v=20261109d';
      sidebar.querySelectorAll('.lab-menu-item').forEach((el, j) => {
        el.classList.toggle('active', j === i);
      });
      if (pushHistory !== false) {
        history.replaceState(null, '', 'experiment.html?lab=' + (i + 1));
      }
    }

    // iframe 加载完成后：把实验页内的链接改为顶层跳转，避免页面套娃；
    // 除实验四（本身没有导航栏）外，隐藏实验页顶部与本页重复的导航栏（仅框架内隐藏，单独打开不受影响）
    function hideInnerNav() {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        doc.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (href && !href.startsWith('#') && !a.target) {
            a.target = '_top';
          }
        });
        if (!doc.getElementById('hide-nav-style')) {
          const style = doc.createElement('style');
          style.id = 'hide-nav-style';
          // 实验七~十五：隐藏导航栏后去掉预留的顶部间距，让正文与左侧目录标题对齐
          const extra = current >= 6 ? '.main{padding-top:0!important}.lab-container{padding-top:20px!important}' : '';
          style.textContent = '.navbar{display:none!important;}' + extra;
          (doc.head || doc.documentElement).appendChild(style);
        }
      } catch (e) { /* 跨域时忽略（本站同源不会发生） */ }
    }
    // load 后再补一次，兜住个别浏览器 load 时 head 尚未就绪的情况
    frame.addEventListener('load', () => {
      hideInnerNav();
      setTimeout(hideInnerNav, 50);
    });

    // 支持 ?lab=N 直达，默认打开实验一
    const initLab = parseInt(new URLSearchParams(location.search).get('lab')) || 1;
    selectLab(Math.min(Math.max(initLab, 1), labs.length) - 1, false);
  </script>
</body>
</html>
