<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模拟试题 - 数据结构课程</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .paper-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--nav-height));
    }
    .paper-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .paper-bar .back-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .paper-bar .paper-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-right: auto;
      white-space: nowrap;
    }
    .tab-btn {
      padding: 8px 18px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--text);
      transition: all 0.2s;
    }
    .tab-btn:hover { border-color: var(--primary); color: var(--primary); }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .paper-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }
    @media print {
      .navbar, .paper-bar { display: none !important; }
      .paper-wrap { height: auto; }
      .paper-frame { height: 100vh; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">📚 数据结构课程</a>
    <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="ch1.html">课程学习</a></li>
      <li><a href="quiz-ch1.html">随堂练习</a></li>
      <li><a href="selftest.html">题库自测</a></li>
      <li><a href="mock-exam.html" class="active">模拟试题</a></li>
      <li><a href="experiment.html">实验中心</a></li>
      <li><a href="knowledge.html">知识库</a></li>
      <li><a href="discuss.html">交流讨论</a></li>
    </ul>
  </nav>

  <main class="main" style="padding-top: var(--nav-height);">
    <div class="paper-wrap">
      <div class="paper-bar">
        <a href="mock-exam.html" class="back-link">← 返回试题列表</a>
        <span class="paper-title" id="paper-title">数据结构模拟试题</span>
        <button type="button" class="tab-btn active" data-tab="paper">📄 试题</button>
        <button type="button" class="tab-btn" data-tab="answer">🔑 参考答案</button>
        <button type="button" class="tab-btn" onclick="printPaper()">🖨️ 打印</button>
      </div>
      <iframe id="paper-frame" class="paper-frame" src="" title="模拟试题内容"></iframe>
    </div>
  </main>

  <script>
    var CN = { '1': '一', '2': '二', '3': '三', '4': '四', '5': '五', '6': '六' };
    var n = new URLSearchParams(location.search).get('n') || '1';
    if (!CN[n]) n = '1';

    document.getElementById('paper-title').textContent = '数据结构模拟试题（' + CN[n] + '）';
    document.title = '数据结构模拟试题（' + CN[n] + '） - 数据结构课程';

    var frame = document.getElementById('paper-frame');
    var current = 'paper';

    function load(tab) {
      current = tab;
      frame.src = '模拟试题/html/' + (tab === 'answer' ? 'a' : 'p') + n + '.html';
      var btns = document.querySelectorAll('.tab-btn[data-tab]');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === tab);
      }
    }

    var btns = document.querySelectorAll('.tab-btn[data-tab]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        load(this.getAttribute('data-tab'));
      });
    }

    function printPaper() {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) { alert('打印失败：' + e.message); }
    }

    load('paper');
  </script>
</body>
</html>
